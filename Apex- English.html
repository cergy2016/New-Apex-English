            // --- UNIT 8: TYPES OF MEETINGS ---
            "types-of-meetings": { 
                title: "Types of Meetings", 
                description: "Identify meeting formats, interpret agendas, and communicate changes professionally.", 
                level: "Intermediate", 
                minutes: 25, 
                imageUrl: "https://z-cdn-media.chatglm.cn/files/3fcd327d-7269-4f1a-87da-f433c4bc74aa.png?auth_key=1886234541-7196a6ff2cfe42648abf3594d12e9c71-0-cbc900811da963fb558abbe0d31e4290",
                reading: `<p>Types of Meetings. Meetings can be formal or informal. A formal board meeting requires an agenda and minutes to be taken. These meetings follow strict parliamentary procedures.</p>

                <p>Always circulate the agenda 24 hours before the meeting so participants can prepare. This ensures the meeting stays on track and finishes on time.</p>`,
                readingAudioText: "Types of Meetings. Meetings can be formal or informal. A formal board meeting requires an agenda and minutes to be taken. These meetings follow strict parliamentary procedures. Informal meetings, like brainstorming sessions, are more relaxed but still need a clear objective. If you need to delay a meeting, you should use the word 'postpone' rather than saying 'push back' to maintain a professional tone. Always circulate the agenda 24 hours before the meeting so participants can prepare. This ensures the meeting stays on track and finishes on time.",
                vocabulary: [ 
                    { term: "Agenda", phonetic: "/əˈdʒɛndə/", def: "A list of items to be discussed or accomplished during a meeting.", ex: "Please review the agenda for the May 18th meeting before you arrive." }, 
                    { term: "Postpone", phonetic: "/poʊstˈpoʊn/", def: "To cause an event to take place at a later time than originally scheduled.", ex: "We had to postpone the meeting because the manager was sick." } 
                ], 
                phrases: [ 
                    { phrase: "Let's schedule a board meeting.", context: "Proposing a formal discussion." }, 
                    { phrase: "We need to postpone the meeting.", context: "Informing someone of a schedule change." } 
                ], 
                dialogue: [ 
                    { speaker: "A", name: "Sarah", text: "Hi Marcus, did you see the flyer for the Business Timekeeping seminar?" }, 
                    { speaker: "B", name: "Marcus", text: "Yes, it's being led by Keith Tyler, right? In Conference Room C?" }, 
                    { speaker: "A", name: "Sarah", text: "Exactly. It's scheduled for Wednesday at 3:00 PM. Are you attending?" }, 
                    { speaker: "B", name: "Marcus", text: "I planned to, but I have a conflict. Can we postpone our review meeting until Thursday?" }, 
                    { speaker: "A", name: "Sarah", text: "Sure. Let's push it to 10:00 AM Thursday. I'll send out a revised agenda." }, 
                    { speaker: "B", name: "Marcus", text: "Perfect. Will there be minutes taken at the seminar?" }, 
                    { speaker: "A", name: "Sarah", text: "Yes, the admin team will handle the minutes and circulate them afterwards." }, 
                    { speaker: "B", name: "Marcus", text: "Great. I'll review them when I get back. Thanks for rescheduling." } 
                ],

                quiz: [

            // --- UNIT 9: MEETING ETIQUETTE ---
            "meeting-etiquette": { 
                title: "Meeting Etiquette", 
                description: "Participate professionally by avoiding bickering, managing objections, and showing courtesy.", 
                level: "Intermediate", 
                minutes: 25, 
                imageUrl: "https://z-cdn-media.chatglm.cn/files/914f6479-7313-468f-824e-cced930d1396.png?auth_key=1886234541-b6ff94e2def942bca08d704ab3b7efdd-0-4cfd7ac2e6efa1a5f1ca0844160e0b53",
                reading: `<p>Meeting Etiquette. Good meeting etiquette means stating your opinion clearly but only once. Avoid bickering over small details, as this wastes everyone's time.</p>
                <p>Listen actively when others are speaking. Do not interrupt. If you disagree, wait for them to finish and then say, 'I have an objection to that point.'</p>
                <p>If you cannot attend, you should formally send your apologies to the chairperson beforehand. Arriving late is disruptive, so always be punctual. Turn off your phone to minimize distractions.</p>`,
                readingAudioText: "Meeting Etiquette. Good meeting etiquette means stating your opinion clearly but only once. Avoid bickering over small details, as this wastes everyone's time. Listen actively when others are speaking. Do not interrupt. If you disagree, wait for them to finish and then say, 'I have an objection to that point.' If you cannot attend, you should formally send your apologies to the chairperson beforehand. Arriving late is disruptive, so always be punctual. Turn off your phone to minimize distractions.",
                vocabulary: [ 
                    { term: "To send your apologies", phonetic: "/sɛnd jɔːr əˈpɒlədʒiz/", def: "To formally notify someone that you cannot attend a meeting.", ex: "John could not make it today, but he sent his apologies." }, 
                    { term: "Objection", phonetic: "/əbˈdʒɛkʃən/", def: "An expression or feeling of disapproval or opposition.", ex: "I have an objection to this proposal; the budget is too high." } 
                ], 
                phrases: [ 
                    { phrase: "I'd like to state my opinion.", context: "Politely asking to speak." }, 
                    { phrase: "Please send your apologies.", context: "Instructing someone who cannot attend." } 
                ], 
                dialogue: [ 
                    { speaker: "A", name: "Chairperson", text: "Let's move to the next item. Mark could not attend today, but he sent his apologies." }, 
                    { speaker: "B", name: "Sarah", text: "I'd like to state my opinion on the new marketing budget. I think it is too high." }, 
                    { speaker: "A", name: "Chairperson", text: "Noted. Does anyone else have an objection?" }, 
                    { speaker: "C", name: "Tom", text: "I agree with Sarah. We are bickering over ad placements, but the core budget is the issue." }, 
                    { speaker: "A", name: "Chairperson", text: "Let's not bicker. Tom, please state your opinion once and we will move on." }, 
                    { speaker: "C", name: "Tom", text: "We should cut the budget by 10% and reallocate to digital." }, 
                    { speaker: "A", name: "Chairperson", text: "Thank you. I will note that. Let's put this to a vote." } 
                ], 
                grammarTip: { title: "Diplomatic Language in Meetings", explanation: "According to business blogs, good meeting etiquette means stating your opinion clearly but only once, and avoiding bickering. If you must disagree, use diplomatic language rather than aggressive words.", example: "Instead of saying You are wrong, say I have an objection to that point." }, 
                quiz: [ 
                    { q: "According to the Business Blog, what should you do if you cannot attend a meeting?", opts: ["Just do not show up", "Send an email later", "Send your apologies", "Call during the meeting"], correct: 2, exp: "The blog advises that you should formally send your apologies if you are unable to attend." }, 
                    { q: "What does it mean to bicker in a meeting?", opts: ["To present a formal report", "To argue about petty and trivial matters", "To agree with the chairperson", "To take meeting minutes"], correct: 1, exp: "To bicker means to argue about small, unimportant details, which is bad meeting etiquette." } 
                ]

        function renderDashboard() {

            map.innerHTML = courseData.map(unit => {
                const isCompleted = state.completedLessons.includes(unit.slug);
                return `

            const q = unit.quiz[currentQuestion];

                <h3 class="font-serif text-2xl font-bold mb-8 text-navy dark:text-ivory">${q.q}</h3>
                <div class="space-y-3 mb-8" id="quiz-options">${q.opts.map((opt, i) => `<button data-quiz-option="${i}" class="quiz-option w-full text-left p-4 rounded-xl border border-gray-200 dark:border-navy/50 text-navy dark:text-ivory hover:border-gold hover:bg-gray-50 dark:hover:bg-navy/30 transition-all duration-200 flex items-center justify-between"><span>${opt}</span></button>`).join('')}</div>
                <div id="quiz-feedback" class="hidden p-4 rounded-xl border-l-4 mb-6" role="status" aria-live="assertive"><p class="font-bold mb-1 text-navy dark:text-ivory" id="feedback-title"></p><p class="text-sm text-navy/70 dark:text-ivory/70" id="feedback-text"></p></div>
                <button id="next-btn" class="hidden w-full py-3 bg-navy text-ivory dark:bg-gold dark:text-navy rounded-full font-semibold hover:opacity-90 transition-opacity">${currentQuestion < unit.quiz.length - 1 ? 'Next Question' : 'Finish Quiz'}</button>`;
        }

        function selectQuizOption(index) {
            if (currentAudio !== null) return;
            const unit = courseLessons[activeLessonSlug];
            const q = unit.quiz[currentQuestion];
            const options = document.querySelectorAll('.quiz-option');
            const feedback = document.getElementById('quiz-feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const nextBtn = document.getElementById('next-btn');
            options.forEach(o => o.style.pointerEvents = 'none');
            if (index === q.correct) {
                options[index].classList.add('border-gold', 'bg-gold/10');
                options[index].innerHTML += `<span class="text-gold">${icons.check}</span>`;
                feedback.classList.add('bg-gold/10', 'border-gold');
                feedbackTitle.innerText = "Correct!"; feedbackTitle.classList.add('text-gold'); score++;
            } else {
                options[index].classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/20');
                options[index].innerHTML += `<span class="text-red-500">${icons.x}</span>`;
                options[q.correct].classList.add('border-gold', 'bg-gold/10');
                options[q.correct].innerHTML += `<span class="text-gold">${icons.check}</span>`;
                feedback.classList.add('bg-red-50', 'dark:bg-red-900/20', 'border-red-500');
                feedbackTitle.innerText = "Incorrect."; feedbackTitle.classList.add('text-red-500');
            }
            feedbackText.innerText = q.exp; feedback.classList.remove('hidden'); nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            const unit = courseLessons[activeLessonSlug];
            if (currentQuestion < unit.quiz.length - 1) {
                currentQuestion++; renderQuiz();
            } else {
                const container = document.getElementById('quiz-container');
                const percentage = Math.round((score / unit.quiz.length) * 100);
                const passed = percentage >= 70;
                if (passed) { if (!state.completedLessons.includes(activeLessonSlug)) { state.completedLessons.push(activeLessonSlug); saveState(); } }
                container.innerHTML = `<div class="text-center p-12"><div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center bg-gold/10"><span class="${passed ? 'text-gold' : 'text-red-500'}">${passed ? icons.checkCircle : icons.x}</span></div><h3 class="font-serif text-3xl font-bold mb-2 text-navy dark:text-ivory">${passed ? 'Lesson Complete!' : 'Almost there!'}</h3><p class="text-navy/60 dark:text-ivory/60 mb-8">You scored ${score} out of ${unit.quiz.length} (${percentage}%)</p><p class="text-sm text-navy/50 dark:text-ivory/50 mb-8">${passed ? 'Your progress has been saved.' : 'You need a score of 70% or higher to complete this lesson.'}</p><div class="flex flex-col md:flex-row gap-4 justify-center"><button data-nav="dashboard" class="px-6 py-3 bg-navy text-ivory dark:bg-charcoal dark:text-ivory rounded-full font-semibold hover:opacity-90 transition-opacity">Back to Dashboard</button>${!passed ? `<button id="retry-btn" class="px-6 py-3 bg-gold text-navy rounded-full font-semibold hover:bg-gold-dark transition-colors">Try Again</button>` : ''}</div></div>`;
                if (passed) renderDashboard();
                if (!passed) { document.getElementById('retry-btn').addEventListener('click', () => { currentQuestion = 0; score = 0; renderQuiz(); }); }
            }
        }

        // --- AUDIO CONTROLLER (Male & Female Voices) ---
        let voices = [];
        let femaleVoice = null;
        let maleVoice = null;

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            const femaleNames = ["Google US English", "Samantha", "Microsoft Aria Online (Natural) - English (United States)", "Microsoft Zira - English (United States)"];
            const maleNames = ["Google UK English Male", "Daniel", "Microsoft Guy Online (Natural) - English (United States)", "Microsoft David - English (United States)"];
            
            for (const name of femaleNames) { const v = voices.find(v => v.name === name); if (v) { femaleVoice = v; break; } }
            for (const name of maleNames) { const v = voices.find(v => v.name === name); if (v) { maleVoice = v; break; } }
            
            if (!femaleVoice) femaleVoice = voices.find(v => v.lang === 'en-US');
            if (!maleVoice) maleVoice = voices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male')) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang === 'en-US' && v.name.toLowerCase().includes('male'));
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        let currentAudio = null;
        function playAudio(text, btnElement, speaker = 'A') {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (currentAudio) currentAudio.classList.remove('audio-playing');
            if (currentAudio === btnElement) { currentAudio = null; return; }
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = speaker === 'A' ? femaleVoice : maleVoice;
                if (voice) utterance.voice = voice;
                utterance.rate = state.playbackRate;
                utterance.pitch = 1.0;
                if (btnElement) { btnElement.classList.add('audio-playing'); currentAudio = btnElement; }
                utterance.onend = () => { if (btnElement) btnElement.classList.remove('audio-playing'); currentAudio = null; };
                window.speechSynthesis.speak(utterance);
            }
        }

        let isPlayingDialogue = false;
        let dialogueRunId = 0;
        async function playDialogue() {
            const runId = ++dialogueRunId;
            const btnText = document.getElementById('dialogue-btn-text');
            const unit = courseLessons[activeLessonSlug];
            if (isPlayingDialogue) { isPlayingDialogue = false; window.speechSynthesis.cancel(); btnText.innerText = "Listen to all"; return; }
            isPlayingDialogue = true; btnText.innerText = "Stop";
            for (let i = 0; i < unit.dialogue.length; i++) {
                if (!isPlayingDialogue || runId !== dialogueRunId) break;
                const lineElement = document.getElementById(`line-${i}`);
                if (lineElement) lineElement.classList.add('ring-2', 'ring-gold');
                await new Promise(resolve => {
                    const utterance = new SpeechSynthesisUtterance(unit.dialogue[i].text);
                    const v = unit.dialogue[i].speaker === 'A' ? femaleVoice : maleVoice;
                    if (v) utterance.voice = v;
                    utterance.rate = state.playbackRate;
                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    window.speechSynthesis.speak(utterance);
                });
                if (lineElement) lineElement.classList.remove('ring-2', 'ring-gold');
            }
            isPlayingDialogue = false; btnText.innerText = "Listen to all";
        }

        function flipCard(cardId) { const card = document.getElementById(cardId); if (card) card.classList.toggle('rotate-y-180'); }
        function toggleBookmark(event, button) {
            event.stopPropagation();
            const id = button.dataset.bookmark;
            if (!id) return;
            const index = state.bookmarks.indexOf(id);
            if (index >= 0) { state.bookmarks.splice(index, 1); button.classList.remove('text-gold'); button.classList.add('text-navy/40', 'dark:text-ivory/40'); button.innerHTML = icons.bookmark('none'); }
            else { state.bookmarks.push(id); button.classList.add('text-gold'); button.classList.remove('text-navy/40', 'dark:text-ivory/40'); button.innerHTML = icons.bookmark('currentColor'); }
            saveState(); renderDashboard();
        }

        const glossaryData = Object.values(courseLessons).flatMap((lesson) => lesson.vocabulary.map((item) => ({ ...item, unit: lesson.title }))).sort((a, b) => a.term.localeCompare(b.term));

        function renderGlossary(items) {
            const listContainer = document.getElementById('glossary-list');
            listContainer.innerHTML = '';
            if (items.length === 0) { listContainer.innerHTML = '<p class="text-center text-navy/50 dark:text-ivory/50 font-serif text-2xl py-12">No terms found.</p>'; return; }
            const grouped = items.reduce((acc, item) => { const letter = item.term[0].toUpperCase(); if (!acc[letter]) acc[letter] = []; acc[letter].push(item); return acc; }, {});
            Object.keys(grouped).sort().forEach(letter => {
                const groupHtml = `<div><h2 class="font-serif text-3xl font-bold text-gold mb-4 border-b border-gold/20 pb-2">${letter}</h2><div class="bg-white dark:bg-navy-light rounded-2xl shadow-premium border border-gray-100 dark:border-navy/50 divide-y divide-gray-100 dark:divide-navy/50">${grouped[letter].map(item => `<div class="p-6 flex flex-col md:flex-row md:items-start gap-4 hover:bg-gray-50 dark:hover:bg-navy/30 transition-colors"><div class="md:w-1/4"><h3 class="font-serif text-xl font-bold text-navy dark:text-ivory">${item.term}</h3></div><div class="md:w-3/4"><p class="text-navy/80 dark:text-ivory/80 mb-2">${item.def}</p><span class="inline-flex items-center gap-1.5 text-xs font-medium text-navy/50 dark:text-ivory/50 bg-softgray dark:bg-charcoal px-2 py-1 rounded-md">${icons.book} ${item.unit}</span></div></div>`).join('')}</div></div>`;
                listContainer.innerHTML += groupHtml;
            });
        }
        function filterGlossary() {
            const query = document.getElementById('glossary-search').value.toLowerCase();
            const filtered = glossaryData.filter(item => item.term.toLowerCase().includes(query) || item.def.toLowerCase().includes(query));
            renderGlossary(filtered);
        }

        // --- GLOBAL EVENT DELEGATION ---
        document.body.addEventListener('click', (event) => {
            // 1. Navigation
            const navBtn = event.target.closest('[data-nav]');
            if (navBtn) { switchView(navBtn.dataset.nav); return; }

            // 2. Audio
            const audioBtn = event.target.closest('[data-audio]');
            if (audioBtn) { playAudio(audioBtn.dataset.audio, audioBtn, audioBtn.dataset.speaker || 'A'); return; }

            // 3. Bookmarks
            const bookmarkBtn = event.target.closest('[data-bookmark]');
            if (bookmarkBtn) { toggleBookmark(event, bookmarkBtn); return; }

            // 4. Flashcards
            const flipCardBtn = event.target.closest('[data-flip]');
            if (flipCardBtn) { flipCard(flipCardBtn.dataset.flip); return; }

            // 5. Lesson Selection
            const openLessonBtn = event.target.closest('[data-open-lesson]');
            if (openLessonBtn) { openLesson(openLessonBtn.dataset.openLesson); return; }

            // 6. Quiz Options
            const quizOptionBtn = event.target.closest('[data-quiz-option]');
            if (quizOptionBtn) { selectQuizOption(parseInt(quizOptionBtn.dataset.quizOption)); return; }

            // 7. Next Question / Finish Quiz
            const nextBtn = event.target.closest('#next-btn');
            if (nextBtn) { nextQuestion(); return; }

            // 8. Audio Speed
            const speedBtn = event.target.closest('[data-speed]');
            if (speedBtn) {
                state.playbackRate = parseFloat(speedBtn.dataset.speed);
                saveState();
                document.querySelectorAll('.speed-btn').forEach(btn => {
                    if (parseFloat(btn.dataset.speed) === state.playbackRate) { btn.classList.add('bg-gold', 'text-navy'); btn.classList.remove('bg-gray-100', 'dark:bg-navy', 'text-navy/50', 'dark:text-ivory/50'); }
                    else { btn.classList.remove('bg-gold', 'text-navy'); btn.classList.add('bg-gray-100', 'dark:bg-navy', 'text-navy/50', 'dark:text-ivory/50'); }
                });
                return;
            }

            // 9. Play Dialogue
            const playDialogueBtn = event.target.closest('#play-dialogue-btn');
            if (playDialogueBtn) { playDialogue(); return; }
        });

        document.body.addEventListener('keydown', (event) => {
            if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-flip]')) { event.preventDefault(); flipCard(event.target.dataset.flip); }
        });

        document.getElementById('glossary-search').addEventListener('keyup', filterGlossary);

        // --- INIT ---
        renderDashboard();
        renderGlossary(glossaryData);
    });
    </script>
</body>
</html>
